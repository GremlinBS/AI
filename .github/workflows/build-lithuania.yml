name: Build Lithuania MilChat final z9-z15

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-lithuania.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 unzip curl fonts-dejavu-core

      - name: Install map tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/ZUB3C/sqlitedb-map-tools.git" \
            pillow

      - name: Prepare directories
        run: |
          mkdir -p data/styles data/fonts data/parts

      - name: Download Lithuania Shortbread MBTiles
        run: |
          curl -fL \
            --retry 6 \
            --retry-delay 5 \
            -o data/lithuania-shortbread.zip \
            "https://data.bbbike.org/osm/mbtiles/region/europe/lithuania/lithuania.osm.mbtiles-shortbread.zip"

          unzip -o data/lithuania-shortbread.zip -d data/unpacked

          SRC="$(find data/unpacked -type f -name '*.mbtiles' | head -n 1)"

          if [ -z "$SRC" ]; then
            echo "ERROR: MBTiles file not found"
            find data/unpacked -type f
            exit 1
          fi

          mv "$SRC" data/lithuania.mbtiles
          rm -rf data/unpacked data/lithuania-shortbread.zip

          sqlite3 data/lithuania.mbtiles \
            "SELECT name || '=' || value FROM metadata ORDER BY name;" \
            | tee data/source-metadata.txt

      - name: Download local Open Sans glyphs
        run: |
          curl -fL \
            --retry 6 \
            --retry-delay 3 \
            -o data/OpenSansRegular.zip \
            "https://raw.githubusercontent.com/openmaptiles/fonts/gh-pages/Open%20Sans%20Regular.zip"

          unzip -o data/OpenSansRegular.zip -d data/fonts
          rm -f data/OpenSansRegular.zip

          test -f "data/fonts/Open Sans Regular/0-255.pbf"
          test -f "data/fonts/Open Sans Regular/256-511.pbf"
          test -f "data/fonts/Open Sans Regular/768-1023.pbf"

          echo "Local glyphs ready"
          find "data/fonts/Open Sans Regular" -maxdepth 1 -type f | head -n 10

      - name: Create detailed raster style
        run: |
          cat > data/styles/lithuania.json <<'JSON'
          {
            "version": 8,
            "name": "Lithuania MilChat offline z9-z15",
            "glyphs": "{fontstack}/{range}.pbf",
            "sources": {
              "shortbread": {
                "type": "vector",
